# Generate with: cd ios && xcodegen generate   (XcodeGen 2.46.0, pinned in CI)
# AeroDJ.xcodeproj is a generated artifact; edit this file instead.
name: AeroDJ
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
options:
  bundleIdPrefix: com.aerodj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # PhononCore.xcframework is arm64 only (xn-ptts v0.5.0). Simulator builds stay arm64.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  # Single source of truth for domain code and its unit tests.
  AeroDJCore:
    path: AeroDJCore
  # iOS 18 / arm64. Linked only by the AeroDJPhonon framework, not by AeroDJCore.
  # Revision, not the v0.5.0 tag: the tag pointed at this commit on 2026-10-28.
  xn-ptts:
    url: https://github.com/gradium-ai/xn-ptts.git
    revision: e851445158f07061f063e3edff0080f9426c0da2
targets:
  AeroDJ:
    type: application
    platform: iOS
    sources: [AeroDJ]
    dependencies:
      - package: AeroDJCore
      - target: AeroDJShare # embedded into AeroDJ.app/PlugIns
      # AeroDJPhonon is not embedded: build 12 failed App Store processing with ITMS-90755
      # (prohibited instructions) in AeroDJPhonon.framework. With no framework, dlopen returns nil
      # and speech falls back to AVSpeech, the same as AeroDJPhononEnabled off. Re-embed after the fix.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aerodj.app
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: AeroDJ/AeroDJ-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -lz"
        INFOPLIST_KEY_NSAppleMusicUsageDescription: AeroDJ uses Apple Music to play your station.
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: AeroDJ reads today's events, read-only, to mention them in your briefing.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # App Store requires an icon and declared orientations (ITMS 90022/90023/90713/90474).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: AeroDJ/AeroDJ.entitlements
  AeroDJPhonon:
    # iOS 18 wrapper around ptts 0.5.0. The app target stays iOS 17 and does not link this.
    # XcodeGen reads a single-platform target's deploymentTarget as a string. A map is ignored,
    # which left this target on the project iOS 17.0 and unable to import PhononTTS.
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources: [AeroDJPhonon]
    dependencies:
      - package: xn-ptts
        product: ptts
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.aerodj.app.phonon
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        DEAD_CODE_STRIPPING: NO
        OTHER_LDFLAGS: "$(inherited) -Wl,-exported_symbol,_aerodj_phonon_prepare -Wl,-exported_symbol,_aerodj_phonon_synthesize"
  AeroDJShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AeroDJShare
        excludes: [Info.plist]
    dependencies:
      - package: AeroDJCore
    settings:
      base:
        # Must be prefixed by the host app's bundle identifier.
        PRODUCT_BUNDLE_IDENTIFIER: com.aerodj.app.share
        INFOPLIST_FILE: AeroDJShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: AeroDJShare/AeroDJShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  AeroDJUITests:
    # Debug-only UI integration tests and screenshots of the playing screen (capture mode).
    type: bundle.ui-testing
    platform: iOS
    sources: [AeroDJUITests]
    dependencies:
      - target: AeroDJ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aerodj.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AeroDJ
schemes:
  AeroDJ:
    build:
      targets:
        AeroDJ: all
    test:
      targets:
        - package: AeroDJCore/AeroDJCoreTests
  AeroDJStudioUI:
    # Separate scheme so the unit-test scheme stays fast; CI runs this on iPhone and iPad.
    build:
      targets:
        AeroDJ: all
        AeroDJUITests: [test]
    test:
      config: Debug
      targets:
        - AeroDJUITests
