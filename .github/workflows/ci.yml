name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject generated artifacts and credentials
        run: |
          if git ls-files | grep -E '(^|/)(\.build|DerivedData|xcuserdata|\.swiftpm|[^/]+\.xcodeproj)/|\.(o|ipa|p8|p12|pem|key|mobileprovision)$|(^|/)\.env(\.local|\.[a-z]+\.local)?$'; then
            echo "::error::Generated build outputs or credential files are tracked (listed above)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
