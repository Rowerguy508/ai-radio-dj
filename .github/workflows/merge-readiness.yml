name: Merge readiness

# Gate for PRs into integration/device-duo. The check name branch protection
# must require is merge-readiness.
#
# pull_request_target runs the workflow file from the default branch and
# checks out only the pull request's base commit. It does not run code from
# the pull request head. issue_comment, check_run, check_suite, and
# workflow_run also run the default-branch file; this workflow still checks
# out the base commit before it runs the gate scripts.
#
# check_run and check_suite do not fire for suites GitHub Actions itself
# created. CI and iOS finishing is observed via workflow_run. The script
# writes the merge-readiness check onto the head SHA. It does not forge signs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited]
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ['CI', 'iOS']
    types: [completed]

permissions:
  contents: read
  checks: write
  pull-requests: read
  issues: read

concurrency:
  group: merge-readiness-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number || github.event.check_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.event.check_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  merge-readiness:
    name: merge-readiness
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'check_suite' && github.event.check_suite.app.slug != 'github-actions') ||
      (github.event_name == 'check_run' && github.event.check_run.app.slug != 'github-actions') ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the base commit
        id: trusted
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          CS_BASE_SHA: ${{ github.event.check_suite.pull_requests[0].base.sha }}
          CR_BASE_SHA: ${{ github.event.check_run.pull_requests[0].base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request && '1' || '' }}
        run: |
          set -euo pipefail
          ref="${PR_BASE_SHA:-}"
          if [ -z "$ref" ]; then ref="${WR_BASE_SHA:-}"; fi
          if [ -z "$ref" ]; then ref="${CS_BASE_SHA:-}"; fi
          if [ -z "$ref" ]; then ref="${CR_BASE_SHA:-}"; fi
          if [ -z "$ref" ] && [ "$EVENT_NAME" = "issue_comment" ] && [ "$ISSUE_IS_PR" = "1" ]; then
            ref="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls/${ISSUE_NUMBER}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);process.stdout.write((j.base&&j.base.sha)||"")})')"
          fi
          if [ -z "$ref" ]; then
            echo "No pull request base commit. Nothing to gate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::merge-readiness: refusing to check out ${ref}. Expected the base commit sha. Do not merge."
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.trusted.outputs.skip != 'true'
        with:
          ref: ${{ steps.trusted.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.trusted.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Parser self-test
        if: steps.trusted.outputs.skip != 'true'
        run: node scripts/merge-readiness.mjs --self-test
      - name: Evaluate merge readiness
        if: steps.trusted.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/merge-readiness.mjs
