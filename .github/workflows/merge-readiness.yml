name: Merge readiness

# Gate for PRs into integration/device-duo. The check name branch protection
# must require is merge-readiness.
#
# Every trigger below runs this file from the default branch. pull_request
# and pull_request_review are intentionally absent: those events run the
# workflow file from the pull request merge commit, and this token can write
# checks. A review is noticed by "Merge readiness review relay", which has
# no permissions; workflow_run then runs this file.
#
# The checkout ref is the base sha returned by the API for a pull request
# number. Event text, including the relay run name, is only a candidate
# number. This file does not check out the pull request head.
#
# check_run and check_suite do not fire for suites GitHub Actions itself
# created. CI and iOS finishing is observed via workflow_run. The script
# writes the merge-readiness check onto the head SHA from the API. It does
# not forge signs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ['CI', 'iOS', 'Merge readiness review relay']
    types: [completed]

permissions:
  contents: read
  checks: write
  pull-requests: read
  issues: read

concurrency:
  group: merge-readiness-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number || github.event.check_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.event.check_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  merge-readiness:
    name: merge-readiness
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'check_suite' && github.event.check_suite.app.slug != 'github-actions') ||
      (github.event_name == 'check_run' && github.event.check_run.app.slug != 'github-actions') ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the base commit
        id: trusted
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request && '1' || '' }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_TITLE: ${{ github.event.workflow_run.display_title }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          CS_PR: ${{ github.event.check_suite.pull_requests[0].number }}
          CR_PR: ${{ github.event.check_run.pull_requests[0].number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          is_num() { printf '%s' "$1" | grep -Eq '^[1-9][0-9]{0,9}$'; }
          num=""
          case "$EVENT_NAME" in
            pull_request_target) num="${PR_NUMBER:-}" ;;
            issue_comment)
              if [ "$ISSUE_IS_PR" = "1" ]; then num="${ISSUE_NUMBER:-}"; fi
              ;;
            check_suite) num="${CS_PR:-}" ;;
            check_run) num="${CR_PR:-}" ;;
            workflow_run)
              if [ "$WR_NAME" = "Merge readiness review relay" ]; then
                if is_num "${WR_PR:-}" && is_num "${WR_TITLE:-}" && [ "$WR_PR" != "$WR_TITLE" ]; then
                  echo "::error::merge-readiness: relay number ${WR_TITLE} does not match event pull request ${WR_PR}. Do not treat this as a pass."
                  exit 1
                fi
                if is_num "${WR_TITLE:-}"; then num="$WR_TITLE"; else num="${WR_PR:-}"; fi
              else
                num="${WR_PR:-}"
              fi
              ;;
          esac
          if ! is_num "$num"; then
            echo "No pull request number. Nothing to gate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The number is untrusted. The base sha is whatever the API says for that pull request.
          ref="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${num}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);process.stdout.write((j.base&&j.base.sha)||"")})')"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::merge-readiness: API did not return a base sha for pull request ${num}. Do not treat this as a pass."
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.trusted.outputs.skip != 'true'
        with:
          ref: ${{ steps.trusted.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.trusted.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Parser self-test
        if: steps.trusted.outputs.skip != 'true'
        run: node scripts/merge-readiness.mjs --self-test
      - name: Evaluate merge readiness
        if: steps.trusted.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/merge-readiness.mjs
