name: iOS

# No top-level path filter: these checks must always report so they can be
# required. The `changes` job skips the macOS jobs when nothing iOS changed,
# and a skipped job reports success.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files via the API

# macOS jobs: the owner's self-hosted Mac (labels self-hosted, macOS, aerodj) runs only
# same-repo pull_request events, and only once the repo variable AERODJ_SELF_HOSTED is '1'.
# The repo is public, so fork PRs (head repo != this repo), pushes and every other event
# always use GitHub-hosted macos-latest. testflight.yml stays GitHub-hosted. -Atlas
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/ios.yml'

  core-tests:
    name: AeroDJCore tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ (vars.AERODJ_SELF_HOSTED == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","aerodj"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests
        run: swift test
        working-directory: ios/AeroDJCore
      - name: Fixture scan fails closed (fake DerivedData test)
        run: ios/scripts/check-release-excludes-preview-fixtures-test.sh
      - name: Release build excludes the debug test station and PlaybackFixtures
        run: ios/scripts/check-release-excludes-test-station.sh
      - name: Release build cannot enable paid voices
        run: ios/scripts/check-release-disables-paid-voice.sh
      - name: Privacy manifests match the privacy policy (#333)
        run: ios/scripts/check-privacy-manifests.py

  # Linux SwiftPM discovery. swift test here is the official Swift 6.2 image.
  # It does not replace the macOS AeroDJCore job or the iOS simulator gates.
  linux-core-tests:
    name: AeroDJCore tests (Linux)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Build tests
        run: swift build --build-tests
        working-directory: ios/AeroDJCore
      - name: Run core tests
        run: swift test
        working-directory: ios/AeroDJCore

  simulator-build:
    name: iOS simulator build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ (vars.AERODJ_SELF_HOSTED == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","aerodj"]') || 'macos-latest' }}
    env:
      XCODEGEN_VERSION: 2.46.0
      DERIVED_DATA: ios/build/DerivedData
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Select Xcode
        # The self-hosted Mac has no passwordless sudo: it must already have Xcode.app selected. -Atlas
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          set -euo pipefail
          want=/Applications/Xcode.app/Contents/Developer
          if [ "$(xcode-select -p)" = "$want" ]; then
            echo "Xcode already selected: $want"
          elif [ "$RUNNER_ENV" = "github-hosted" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            echo "::error::Self-hosted runner has $(xcode-select -p) selected; run 'sudo xcode-select -s /Applications/Xcode.app' on the Mac once."
            exit 1
          fi
      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1 && xcrun metal --version; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading component"
            xcodebuild -downloadComponent MetalToolchain
            if ! xcrun metal --version; then
              echo "::error::Metal toolchain still unavailable after xcodebuild -downloadComponent MetalToolchain"
              exit 1
            fi
          fi
      - name: Build app and embedded share extension
        run: |
          xcodebuild build \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJ \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify share extension is embedded
        run: |
          APPEX="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AeroDJ.app/PlugIns/AeroDJShare.appex"
          test -d "$APPEX" || { echo "AeroDJShare.appex not embedded in AeroDJ.app"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist" \
            | grep -qx 'com.apple.share-services'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist" | grep -qx 'com.aerodj.app.share'
          # Share sheet shows the app's display name (AppName.display).
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APPEX/Info.plist" | grep -qx 'OnAirly' \
            || { echo "share extension display name is not OnAirly"; exit 1; }
          # #333: both privacy manifests must be bundled, not just present in the repo.
          for M in "$APPEX/../../PrivacyInfo.xcprivacy" "$APPEX/PrivacyInfo.xcprivacy"; do
            test -f "$M" || { echo "PrivacyInfo.xcprivacy not bundled: $M"; exit 1; }
            plutil -lint "$M"
          done
      - name: Verify single-window scene manifest
        # app-resizability: the app declares UIApplicationSceneManifest, and one window only
        # (one app-scoped DJ session). No UIRequiresFullScreen opt-out.
        run: |
          PLIST="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AeroDJ.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes' "$PLIST" \
            | grep -qx 'false' || { echo "UIApplicationSupportsMultipleScenes is not false"; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' "$PLIST" 2>/dev/null; then
            echo "UIRequiresFullScreen must not be set"; exit 1
          fi
          # INFOPLIST_FILE merge must keep the generated keys.
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$PLIST" \
            | grep -qw 'audio' || { echo "UIBackgroundModes lost audio"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSCalendarsFullAccessUsageDescription' "$PLIST" \
            | grep -q '.' || { echo "NSCalendarsFullAccessUsageDescription missing"; exit 1; }
          # Display name: OnAirly on the home screen; the bundle ID stays com.aerodj.app.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" | grep -qx 'OnAirly' \
            || { echo "CFBundleDisplayName is not OnAirly"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" | grep -qx 'com.aerodj.app' \
            || { echo "bundle ID changed"; exit 1; }
          for key in NSAppleMusicUsageDescription NSCalendarsFullAccessUsageDescription; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" 2>/dev/null) \
              || { echo "$key missing"; exit 1; }
            test -n "$VALUE" || { echo "$key is empty"; exit 1; }
            if printf '%s' "$VALUE" | grep -q 'AeroDJ'; then
              echo "$key still names AeroDJ"; exit 1
            fi
          done
      - name: Pick an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid // empty')
          test -n "$UDID" || { echo "No available iPhone simulator"; exit 1; }
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Run unit tests on simulator
        run: |
          xcodebuild test \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJ \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

  device-build:
    name: iOS device build (unsigned)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ (vars.AERODJ_SELF_HOSTED == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","aerodj"]') || 'macos-latest' }}
    env:
      XCODEGEN_VERSION: 2.46.0
      DERIVED_DATA: ios/build/DerivedData-device
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1 && xcrun metal --version; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading component"
            xcodebuild -downloadComponent MetalToolchain
            if ! xcrun metal --version; then
              echo "::error::Metal toolchain still unavailable after xcodebuild -downloadComponent MetalToolchain"
              exit 1
            fi
          fi
      - name: Build Debug and Release for a physical device without signing
        # Proves both arm64 device slices compile. Release proves the test station is
        # compiled out. Signing needs the owner's team (ios/Config/Signing.local.xcconfig),
        # so CI signs nothing.
        run: |
          for CONFIG in Debug Release; do
            xcodebuild build \
              -project ios/AeroDJ.xcodeproj \
              -scheme AeroDJ \
              -configuration "$CONFIG" \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=''
          done
      - name: Release device app excludes fixture art, the preview loader and PlaybackFixtures
        # Same scan as the Release simulator check in runtime-mode, on the unsigned arm64 device
        # build (Sentinel's #269 nit). The Debug device build is the positive control; a missing
        # .app or binary fails. Build and binary scan only, not a physical-device run. -Fry
        run: |
          for CONFIG in Debug Release; do
            APP="$DERIVED_DATA/Build/Products/$CONFIG-iphoneos/AeroDJ.app"
            test -d "$APP" || { echo "::error::$APP missing"; exit 1; }
            test -f "$APP/AeroDJ" || { echo "::error::$APP/AeroDJ missing"; exit 1; }
          done
          ios/scripts/check-release-excludes-preview-fixtures.sh \
            "$DERIVED_DATA/Build/Products/Debug-iphoneos/AeroDJ.app" \
            "$DERIVED_DATA/Build/Products/Release-iphoneos/AeroDJ.app"
      - name: P0 diagnostics are absent from Release and present only with AERODJ_P0_DIAG
        # TEMPORARY with #121 / #133. Proves the diag build compiles, and that a plain Release
        # (what App Store builds use) carries no P0 diagnostics code. Experiment A (Direct Mode)
        # is removed; diag builds launch the normal app with the DJ session. -Atlas
        run: |
          RELEASE_BIN="$DERIVED_DATA/Build/Products/Release-iphoneos/AeroDJ.app/AeroDJ"
          test -f "$RELEASE_BIN"
          for NEEDLE in P0EventTrace P0TraceRow P0PollSampler P0DetectorState P0TraceView P0ScenePhaseTrace p0trace p0_diag; do
            if LC_ALL=C grep -a -q "$NEEDLE" "$RELEASE_BIN"; then
              echo "::error::P0 diagnostics code ($NEEDLE) found in a Release build without AERODJ_P0_DIAG"
              exit 1
            fi
          done
          DIAG_DD="$RUNNER_TEMP/DerivedDataP0Diag"
          xcodebuild build \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DIAG_DD" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) AERODJ_P0_DIAG'
          # Positive control: the same checks do find it when the flag is set.
          DIAG_BIN="$DIAG_DD/Build/Products/Release-iphoneos/AeroDJ.app/AeroDJ"
          # P0EventTrace / P0PollSampler live in the AeroDJCore package, so finding them proves
          # the flag reaches the package too. P0EventTraceHost and P0EventTracePanel are the
          # app's on-screen trace (TEMPORARY with #121 / #133, -Fry).
          for NEEDLE in P0EventTraceHost P0EventTrace P0PollSampler P0TraceView P0EventTracePanel; do
            LC_ALL=C grep -a -q "$NEEDLE" "$DIAG_BIN" || { echo "::error::$NEEDLE missing from the AERODJ_P0_DIAG build"; exit 1; }
          done
      - name: Owner A/B gate script fails closed (fake xcodebuild test)
        run: ios/scripts/check-owner-ab-build-settings-test.sh
      - name: Owner A/B (AERODJ_OWNER_AB) is absent from Release build settings unless dispatched with owner_ab
        # Runs testflight.yml's own composition script, then reads the real Release settings
        # (xcodebuild -showBuildSettings). Push/other events and empty/missing/false inputs
        # must not pass the flag; a dispatch with owner_ab=true must (positive control). -Echo
        run: |
          for CASE in "push true" "pull_request true" "schedule true" "workflow_dispatch " \
                      "workflow_dispatch false" "workflow_dispatch TRUE" "workflow_dispatch true"; do
            read -r EV AB <<< "$CASE" || true
            CONDS="$(EVENT_NAME="$EV" OWNER_AB="${AB:-}" P0_DIAG=false ios/scripts/testflight-swift-conditions.sh)"
            EXTRA=(); [ -z "$CONDS" ] || EXTRA+=("SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited)$CONDS")
            EXPECT=absent; [ "$CASE" != "workflow_dispatch true" ] || EXPECT=present
            echo "== event=$EV owner_ab='${AB:-}' expect=$EXPECT"
            ios/scripts/check-owner-ab-build-settings.sh "$EXPECT" "${EXTRA[@]}"
          done
      - name: Device app embeds no AeroDJPhonon and has no private AMX instructions (ITMS-90755)
        run: |
          for CONFIG in Debug Release; do
            APP="$DERIVED_DATA/Build/Products/$CONFIG-iphoneos/AeroDJ.app"
            test -x "$APP/AeroDJ" || { echo "::error::$APP/AeroDJ missing"; exit 1; }
            if find "$APP" -iname '*Phonon*' -print | grep .; then
              echo "::error::$CONFIG device AeroDJ.app contains Phonon content"; exit 1
            fi
          done
          # Positive control: the pinned PhononCore that build 12 shipped. Resolve explicitly, since
          # no built target links xn-ptts now.
          xcodebuild -resolvePackageDependencies -project ios/AeroDJ.xcodeproj -scheme AeroDJ \
            -derivedDataPath "$DERIVED_DATA" >/dev/null
          CONTROL="$(find "$DERIVED_DATA/SourcePackages" -path '*ios-arm64/*' -name 'libptts_ffi.a' -print -quit)"
          test -n "$CONTROL" || { echo "::error::pinned libptts_ffi.a (ios-arm64) not found for the positive control"; exit 1; }
          ios/scripts/check-no-private-amx.sh "$DERIVED_DATA/Build/Products/Release-iphoneos/AeroDJ.app" "$CONTROL"

  runtime-mode:
    name: Runtime mode on simulator (Debug vs Release)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ (vars.AERODJ_SELF_HOSTED == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","aerodj"]') || 'macos-latest' }}
    env:
      XCODEGEN_VERSION: 2.46.0
      DERIVED_DATA: ios/build/DerivedData-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1 && xcrun metal --version; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading component"
            xcodebuild -downloadComponent MetalToolchain
            if ! xcrun metal --version; then
              echo "::error::Metal toolchain still unavailable after xcodebuild -downloadComponent MetalToolchain"
              exit 1
            fi
          fi
      - name: Build Debug and Release for the simulator
        run: |
          for CONFIG in Debug Release; do
            xcodebuild build \
              -project ios/AeroDJ.xcodeproj \
              -scheme AeroDJ \
              -configuration "$CONFIG" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO
          done
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid // empty')
          test -n "$UDID" || { echo "No available iPhone simulator"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Verify the launch argument changes runtime dependencies
        run: |
          ios/scripts/verify-runtime-mode.sh \
            "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AeroDJ.app" \
            "$DERIVED_DATA/Build/Products/Release-iphonesimulator/AeroDJ.app" \
            "$SIM_UDID"
      - name: Release app excludes fixture art, the preview loader and PlaybackFixtures
        run: |
          ios/scripts/check-release-excludes-preview-fixtures.sh \
            "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AeroDJ.app" \
            "$DERIVED_DATA/Build/Products/Release-iphonesimulator/AeroDJ.app"
      - name: App does not embed AeroDJPhonon (ITMS-90755 hold)
        run: |
          for cfg in Debug Release; do
            app="$DERIVED_DATA/Build/Products/$cfg-iphonesimulator/AeroDJ.app"
            test -x "$app/AeroDJ" || { echo "::error::$app/AeroDJ missing"; exit 1; }
            if find "$app" -iname '*Phonon*' -print | grep .; then
              echo "::error::$cfg AeroDJ.app contains Phonon content"; exit 1
            fi
            echo "OK: $cfg AeroDJ.app has no Phonon content."
          done

  studio-screenshots:
    name: Studio UI tests and screenshots (closed + open)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ (vars.AERODJ_SELF_HOSTED == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","aerodj"]') || 'macos-latest' }}
    env:
      XCODEGEN_VERSION: 2.46.0
      DERIVED_DATA: ios/build/DerivedData-ui
      SHOTS: ${{ github.workspace }}/studio-screenshots
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1 && xcrun metal --version; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading component"
            xcodebuild -downloadComponent MetalToolchain
            if ! xcrun metal --version; then
              echo "::error::Metal toolchain still unavailable after xcodebuild -downloadComponent MetalToolchain"
              exit 1
            fi
          fi
      - name: Toolchain
        run: xcodebuild -version
      - name: Pick iPhone (closed) and iPad (open) simulators
        run: |
          pick() {
            xcrun simctl list devices available -j \
              | jq -r --arg p "$1" '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                        | select(.name | startswith($p))] | last | .udid // empty'
          }
          PHONE=$(pick iPhone); PAD=$(pick iPad)
          test -n "$PHONE" && test -n "$PAD" || { echo "Need an iPhone and an iPad simulator"; exit 1; }
          echo "PHONE_UDID=$PHONE" >> "$GITHUB_ENV"
          echo "PAD_UDID=$PAD" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep -E "$PHONE|$PAD"
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJStudioUI \
            -destination "id=$PHONE_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
      - name: UI launch-timeout retry script test
        run: ios/scripts/ui-launch-timeout-retry-test.sh
      - name: UI tests on iPhone (closed, compact player)
        run: |
          mkdir -p "$SHOTS"
          xcrun simctl boot "$PHONE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$PHONE_UDID" -b
          ios/scripts/ui-launch-timeout-retry.sh --udid "$PHONE_UDID" -- \
            env TEST_RUNNER_STUDIO_SCREENSHOT_DIR="$SHOTS" xcodebuild test-without-building \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJStudioUI \
            -destination "id=$PHONE_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/phone.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Record a tapped walkthrough on iPhone (XCUITest + simctl recordVideo)
        run: |
          xcrun simctl boot "$PHONE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$PHONE_UDID" -b
          xcrun simctl io "$PHONE_UDID" recordVideo --codec h264 --force "$SHOTS/walkthrough-closed.mp4" &
          REC=$!
          sleep 2
          ios/scripts/ui-launch-timeout-retry.sh --udid "$PHONE_UDID" -- \
            env TEST_RUNNER_STUDIO_WALKTHROUGH=1 xcodebuild test-without-building \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJStudioUI \
            -destination "id=$PHONE_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:AeroDJUITests/StudioScreenTests/testRecordedWalkthrough \
            CODE_SIGNING_ALLOWED=NO || STATUS=$?
          kill -INT "$REC"; wait "$REC" || true
          ls -la "$SHOTS"/*.mp4
          exit ${STATUS:-0}
      - name: UI tests on iPad (open, two-zone Studio)
        run: |
          # One simulator at a time: the iPhone stays booted after its steps, and a cold iPad
          # booted by xcodebuild mid-run made launches, terminations and accessibility
          # snapshots stall (flaky iPad failures across PRs). Shut the iPhone down and wait
          # for the iPad to finish booting before the suite starts.
          xcrun simctl shutdown "$PHONE_UDID" 2>/dev/null || true
          xcrun simctl boot "$PAD_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$PAD_UDID" -b
          ios/scripts/ui-launch-timeout-retry.sh --udid "$PAD_UDID" -- \
            env TEST_RUNNER_STUDIO_SCREENSHOT_DIR="$SHOTS" xcodebuild test-without-building \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJStudioUI \
            -destination "id=$PAD_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/pad.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Require screenshots
        run: |
          ls -la "$SHOTS"
          ls "$SHOTS" | grep -q '^closed-compact_' || { echo "missing closed screenshot"; exit 1; }
          ls "$SHOTS" | grep -q '^open-studio-queue_' || { echo "missing open screenshot"; exit 1; }
          for shot in closed-dark closed-state-empty closed-state-loading closed-state-error closed-state-denied \
                      closed-connections-revoked closed-tune-config-change closed-large-text \
                      open-studio-tune-dark open-large-text open-connections-revoked open-tune-config-change \
                      closed-queue-sheet-dark open-studio-queue-dark \
                      closed-connections-dark open-studio-connections-dark \
                      closed-station-list-dark open-station-list-dark \
                      closed-state-empty-dark closed-state-loading-dark closed-state-error-dark \
                      closed-state-denied-dark closed-state-playbackFailed-dark \
                      open-state-empty-dark open-state-loading-dark open-state-error-dark \
                      open-state-denied-dark open-state-playbackFailed-dark \
                      closed-ax5-dark open-ax5-dark \
                      iphone-landscape iphone-landscape-dark ipad-landscape ipad-landscape-dark \
                      duo-wide-ready; do
            ls "$SHOTS" | grep -q "^${shot}_" || { echo "missing $shot screenshot"; exit 1; }
          done
          test -s "$SHOTS/walkthrough-closed.mp4" || { echo "missing walkthrough recording"; exit 1; }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-screenshots
          path: |
            studio-screenshots/*.png
            studio-screenshots/*.mp4
          if-no-files-found: warn
      - name: Upload iPhone UI result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-xcresult
          path: ${{ runner.temp }}/phone.xcresult
          if-no-files-found: warn
      - name: Upload iPad UI result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pad-xcresult
          path: ${{ runner.temp }}/pad.xcresult
          if-no-files-found: warn
