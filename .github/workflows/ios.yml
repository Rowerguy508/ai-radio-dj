name: iOS

# No top-level path filter: these checks must always report so they can be
# required. The `changes` job skips the macOS jobs when nothing iOS changed,
# and a skipped job reports success.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files via the API

# A new push to a PR branch cancels that branch's stale run. Pushes to main
# are not cancelled mid-run. workflow_dispatch and schedule (none here) would
# keep their own group via github.ref and would not be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# macOS jobs: the owner's self-hosted Mac (labels self-hosted, macOS, aerodj) runs only
# same-repo pull_request events.
# - AERODJ_SELF_HOSTED == '1': every gated macOS job on the mini (existing behavior).
# - AERODJ_MINI_STUDIO == '1': only the "Studio UI tests and screenshots (closed + open)"
#   job on the mini; the other gated macOS jobs stay on macos-latest.
# The repo is public, so fork PRs (head repo != this repo), pushes and every other event
# always use GitHub-hosted macos-latest. testflight.yml stays GitHub-hosted. -Atlas
# Exception: "iOS simulator build" (StoreKit tests) is always GitHub-hosted until the Mac's
# SKTestSession Code=3 is fixed (#383 / #384). -Orion
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      core: ${{ steps.filter.outputs.core }}
      consent: ${{ steps.filter.outputs.consent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/ios.yml'
            # AeroDJCore tests also read these docs (repoFile in CloudVoiceAllLinesTests and
            # friends), so a copy edit must run both core-test jobs. #509 skipped them and
            # broke integration (X1). Only the two core jobs use this output. -Sentinel
            core:
              - 'ios/**'
              - '.github/workflows/ios.yml'
              # Voice-gate test reads testflight.yml. A workflow-only edit must still run
              # it. Kept off the ios filter so a dispatch-policy change does not rebuild
              # the Release archive.
              - '.github/workflows/testflight.yml'
              - 'docs/site/privacy.md'
              - 'docs/site/HOLD-pro.md'
              - 'docs/site/DRAFT-privacy-tester-voice.md'
              - 'docs/PRIVACY_MATRIX.md'
            # #631 (-Fry): the flagged consent-copy shots rebuild the app twice, so they run only
            # when the local-area consent copy, its prompt, its build flags or its UI test change.
            consent:
              - 'ios/AeroDJCore/Sources/AeroDJCore/Interludes/LocalArea.swift'
              - 'ios/AeroDJ/LocalAreaPrompt.swift'
              - 'ios/AeroDJCore/Sources/AeroDJCore/Voice/CloudVoiceConsent.swift'
              - 'ios/AeroDJCore/Sources/AeroDJCore/Interludes/GDELTNewsProvider.swift'
              - 'ios/AeroDJ/TesterVoiceConsent+App.swift'
              - 'ios/AeroDJUITests/AppWideLayoutTests.swift'
              - '.github/workflows/ios.yml'

  core-tests:
    name: AeroDJCore tests
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ (vars.AERODJ_SELF_HOSTED == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","aerodj"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted Mac persists between jobs: do not leave the job token in .git/config (#517 N1, -Sentinel).
          persist-credentials: false
      - name: Self-hosted prep fails closed under 8 GiB
        run: ios/scripts/ci-selfhosted-prep-test.sh
      - name: Self-hosted disk check
        if: runner.environment == 'self-hosted'
        timeout-minutes: 3
        run: ios/scripts/ci-selfhosted-prep.sh --check-disk
      - name: TestFlight voice gate refuses a default device-speech upload
        run: bash ios/scripts/check-testflight-voice-dispatch-test.sh
      - name: Check Xcode 26.6 and Swift 6.3
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "xcode-select -p:"
          sel="$(xcode-select -p)"
          printf '%s\n' "$sel"
          if [ ! -d "$sel" ]; then
            echo "::error::Selected Xcode path does not exist: $sel"
            exit 1
          fi
          echo "xcodebuild -version:"
          xcode_out="$(xcodebuild -version)"
          printf '%s\n' "$xcode_out"
          echo "swift --version:"
          swift_out="$(swift --version)"
          printf '%s\n' "$swift_out"
          xcode_ver="$(printf '%s\n' "$xcode_out" | awk 'NR==1 { print $2 }')"
          swift_ver="$(printf '%s\n' "$swift_out" | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p')"
          swift_ver="${swift_ver%%$'\n'*}"
          case "$xcode_ver" in
            26.6|26.6.*) ;;
            *)
              echo "::error::Xcode is ${xcode_ver:-unknown} at $sel; this job requires Xcode 26.6"
              exit 1
              ;;
          esac
          case "$swift_ver" in
            6.3|6.3.*) ;;
            *)
              echo "::error::Swift is ${swift_ver:-unknown}; this job requires Swift 6.3"
              exit 1
              ;;
          esac
      - name: Run core tests
        run: swift test
        working-directory: ios/AeroDJCore
      - name: Fixture scan fails closed (fake DerivedData test)
        run: ios/scripts/check-release-excludes-preview-fixtures-test.sh
      - name: StoreKit 0-test guard fails closed (fake xcresulttool test)
        run: ios/scripts/check-xcresult-test-count-test.sh
      - name: Release build excludes the debug test station and PlaybackFixtures
        run: ios/scripts/check-release-excludes-test-station.sh
      - name: Release build cannot enable paid voices
        run: ios/scripts/check-release-disables-paid-voice.sh
      - name: GDELT news only in the tester-voice Release build
        run: ios/scripts/check-release-excludes-gdelt.sh

  # Linux SwiftPM discovery. swift test here is the official Swift 6.2 image.
  # It does not replace the macOS AeroDJCore job or the iOS simulator gates.
  linux-core-tests:
    name: AeroDJCore tests (Linux)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: TestFlight voice gate refuses a default device-speech upload
        run: bash ios/scripts/check-testflight-voice-dispatch-test.sh
      - name: Build tests
        run: swift build --build-tests
        working-directory: ios/AeroDJCore
      - name: Run core tests
        run: swift test
        working-directory: ios/AeroDJCore

  simulator-build:
    name: iOS simulator build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Always GitHub-hosted (Orion's call, #384): on the self-hosted Mac every SKTestSession call
    # fails with SKInternalErrorDomain Code=3 and the StoreKit tests get 0 products, wherever
    # DerivedData lives (run 41543137869). Back on the Mac only once that is fixed; see #383.
    runs-on: macos-latest
    env:
      XCODEGEN_VERSION: 2.46.0
      DERIVED_DATA: ios/build/DerivedData
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Select Xcode
        # The self-hosted Mac has no passwordless sudo: it must already have Xcode.app selected. -Atlas
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          set -euo pipefail
          want=/Applications/Xcode.app/Contents/Developer
          if [ "$(xcode-select -p)" = "$want" ]; then
            echo "Xcode already selected: $want"
          elif [ "$RUNNER_ENV" = "github-hosted" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            echo "::error::Self-hosted runner has $(xcode-select -p) selected; run 'sudo xcode-select -s /Applications/Xcode.app' on the Mac once."
            exit 1
          fi
      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1 && xcrun metal --version; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading component"
            xcodebuild -downloadComponent MetalToolchain
            if ! xcrun metal --version; then
              echo "::error::Metal toolchain still unavailable after xcodebuild -downloadComponent MetalToolchain"
              exit 1
            fi
          fi
      - name: Build app and embedded share extension
        run: |
          xcodebuild build \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJ \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify share extension is embedded
        run: |
          APPEX="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AeroDJ.app/PlugIns/AeroDJShare.appex"
          test -d "$APPEX" || { echo "AeroDJShare.appex not embedded in AeroDJ.app"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist" \
            | grep -qx 'com.apple.share-services'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist" | grep -qx 'com.aerodj.app.share'
          # Share sheet shows the app's display name (AppName.display).
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APPEX/Info.plist" | grep -qx 'OnAirly' \
            || { echo "share extension display name is not OnAirly"; exit 1; }
      - name: Verify widget extension is embedded
        # #465 item 7: the StandBy widget and Live Activity ship in AeroDJ.app/PlugIns.
        run: |
          APPEX="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AeroDJ.app/PlugIns/AeroDJWidgets.appex"
          test -d "$APPEX" || { echo "AeroDJWidgets.appex not embedded in AeroDJ.app"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist" \
            | grep -qx 'com.apple.widgetkit-extension'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist" | grep -qx 'com.aerodj.app.widgets'
      - name: Verify single-window scene manifest
        # app-resizability: the app declares UIApplicationSceneManifest, and one window only
        # (one app-scoped DJ session). No UIRequiresFullScreen opt-out.
        run: |
          PLIST="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AeroDJ.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes' "$PLIST" \
            | grep -qx 'false' || { echo "UIApplicationSupportsMultipleScenes is not false"; exit 1; }
          # CarPlay is a template scene on the same manifest, not a second phone window (#438).
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication:0:UISceneClassName' "$PLIST" \
            | grep -qx 'CPTemplateApplicationScene' || { echo "CarPlay scene class missing from built Info.plist"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication:0:UISceneDelegateClassName' "$PLIST" \
            | grep -q 'CarPlaySceneDelegate' || { echo "CarPlay scene delegate missing from built Info.plist"; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication' "$PLIST" 2>/dev/null; then
            echo "Phone window scene must stay on the SwiftUI default"; exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' "$PLIST" 2>/dev/null; then
            echo "UIRequiresFullScreen must not be set"; exit 1
          fi
          # INFOPLIST_FILE merge must keep the generated keys.
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$PLIST" \
            | grep -qw 'audio' || { echo "UIBackgroundModes lost audio"; exit 1; }
          # Export compliance (TestFlight): exempt encryption only (HTTPS, Keychain, App Attest, hashing).
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$PLIST" \
            | grep -qx 'false' || { echo "ITSAppUsesNonExemptEncryption is not false"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSCalendarsFullAccessUsageDescription' "$PLIST" \
            | grep -q '.' || { echo "NSCalendarsFullAccessUsageDescription missing"; exit 1; }
          # Display name: OnAirly on the home screen; the bundle ID stays com.aerodj.app.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" | grep -qx 'OnAirly' \
            || { echo "CFBundleDisplayName is not OnAirly"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" | grep -qx 'com.aerodj.app' \
            || { echo "bundle ID changed"; exit 1; }
          for key in NSAppleMusicUsageDescription NSCalendarsFullAccessUsageDescription; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" 2>/dev/null) \
              || { echo "$key missing"; exit 1; }
            test -n "$VALUE" || { echo "$key is empty"; exit 1; }
            if printf '%s' "$VALUE" | grep -q 'AeroDJ'; then
              echo "$key still names AeroDJ"; exit 1
            fi
          done
      - name: Pick an iPhone simulator on iOS 26.2 (StoreKit tests)
        # TEMPORARY WORKAROUND: remove this pin once Apple ships a simulator runtime fix.
        # This job runs AeroDJStoreKitTests. They pass on iOS 26.2 but fail on iOS 26.5 with
        # SKTestSession SKInternalErrorDomain Code=3 and 0 products (reported, not confirmed by
        # Apple). The old `last` pick only landed on 26.2 by simctl ordering; pin it explicitly.
        # Same device as before within 26.2 (last iPhone). Fails loudly when 26.2 has no iPhone.
        run: |
          set -euo pipefail
          RUNTIME=com.apple.CoreSimulator.SimRuntime.iOS-26-2
          PICK=$(xcrun simctl list devices available -j | jq -r --arg rt "$RUNTIME" '
            .devices[$rt] // [] | map(select(.name | startswith("iPhone"))) | last
            | if . == null then empty else "\(.udid)\t\(.name)" end')
          if [ -z "$PICK" ]; then
            echo "::error::No available iPhone on the iOS 26.2 runtime ($RUNTIME) for StoreKit tests"
            xcrun simctl list runtimes
            exit 1
          fi
          IFS=$'\t' read -r UDID NAME <<<"$PICK"
          VERSION=$(xcrun simctl list runtimes -j | jq -r --arg rt "$RUNTIME" '.runtimes[] | select(.identifier == $rt) | .version')
          echo "Picked simulator: name=$NAME udid=$UDID runtime=$RUNTIME version=$VERSION"
          echo "iPhone simulator: $NAME, ${RUNTIME##*.} ($VERSION), $UDID" >> "$GITHUB_STEP_SUMMARY"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Run unit tests on simulator
        # The AeroDJ scheme's tests: AeroDJCoreTests and AeroDJStoreKitTests. The result bundle and
        # log feed the StoreKit 0-test guard below.
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJ \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/sim-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/sim-tests.log"
      - name: StoreKit tests actually ran (at least 11 executed, skips excluded)
        # Sentinel's N2 (#391): a scheme change or a target that silently drops out would otherwise
        # pass with 0 StoreKit tests. 11 is the current count in AeroDJStoreKitTests. -Fry
        run: |
          ios/scripts/check-xcresult-test-count.sh --bundle AeroDJStoreKitTests --min 11 \
            --xcresult "$RUNNER_TEMP/sim-tests.xcresult" --log "$RUNNER_TEMP/sim-tests.log"

  device-build:
    name: iOS device build (unsigned)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ (vars.AERODJ_SELF_HOSTED == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","aerodj"]') || 'macos-latest' }}
    env:
      XCODEGEN_VERSION: 2.46.0
      DERIVED_DATA: ios/build/DerivedData-device
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted Mac persists between jobs: do not leave the job token in .git/config (#517 N1, -Sentinel).
          persist-credentials: false
      - name: Self-hosted disk check
        if: runner.environment == 'self-hosted'
        timeout-minutes: 3
        run: ios/scripts/ci-selfhosted-prep.sh --check-disk
      - name: Check Xcode 26.6 and Swift 6.3
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "xcode-select -p:"
          sel="$(xcode-select -p)"
          printf '%s\n' "$sel"
          if [ ! -d "$sel" ]; then
            echo "::error::Selected Xcode path does not exist: $sel"
            exit 1
          fi
          echo "xcodebuild -version:"
          xcode_out="$(xcodebuild -version)"
          printf '%s\n' "$xcode_out"
          echo "swift --version:"
          swift_out="$(swift --version)"
          printf '%s\n' "$swift_out"
          xcode_ver="$(printf '%s\n' "$xcode_out" | awk 'NR==1 { print $2 }')"
          swift_ver="$(printf '%s\n' "$swift_out" | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p')"
          swift_ver="${swift_ver%%$'\n'*}"
          case "$xcode_ver" in
            26.6|26.6.*) ;;
            *)
              echo "::error::Xcode is ${xcode_ver:-unknown} at $sel; this job requires Xcode 26.6"
              exit 1
              ;;
          esac
          case "$swift_ver" in
            6.3|6.3.*) ;;
            *)
              echo "::error::Swift is ${swift_ver:-unknown}; this job requires Swift 6.3"
              exit 1
              ;;
          esac
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1 && xcrun metal --version; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading component"
            xcodebuild -downloadComponent MetalToolchain
            if ! xcrun metal --version; then
              echo "::error::Metal toolchain still unavailable after xcodebuild -downloadComponent MetalToolchain"
              exit 1
            fi
          fi
      - name: Build Debug and Release for a physical device without signing
        # Proves both arm64 device slices compile. Release proves the test station is
        # compiled out. Signing needs the owner's team (ios/Config/Signing.local.xcconfig),
        # so CI signs nothing.
        run: |
          for CONFIG in Debug Release; do
            xcodebuild build \
              -project ios/AeroDJ.xcodeproj \
              -scheme AeroDJ \
              -configuration "$CONFIG" \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=''
          done
      - name: Release device app excludes fixture art, the preview loader and PlaybackFixtures
        # Same scan as the Release simulator check in runtime-mode, on the unsigned arm64 device
        # build (Sentinel's #269 nit). The Debug device build is the positive control; a missing
        # .app or binary fails. Build and binary scan only, not a physical-device run. -Fry
        run: |
          for CONFIG in Debug Release; do
            APP="$DERIVED_DATA/Build/Products/$CONFIG-iphoneos/AeroDJ.app"
            test -d "$APP" || { echo "::error::$APP missing"; exit 1; }
            test -f "$APP/AeroDJ" || { echo "::error::$APP/AeroDJ missing"; exit 1; }
          done
          ios/scripts/check-release-excludes-preview-fixtures.sh \
            "$DERIVED_DATA/Build/Products/Debug-iphoneos/AeroDJ.app" \
            "$DERIVED_DATA/Build/Products/Release-iphoneos/AeroDJ.app"
      - name: P0 diagnostics are absent from Release and present only with AERODJ_P0_DIAG
        # TEMPORARY with #121 / #133. Proves the diag build compiles, and that a plain Release
        # (what App Store builds use) carries no P0 diagnostics code. Experiment A (Direct Mode)
        # is removed; diag builds launch the normal app with the DJ session. -Atlas
        run: |
          RELEASE_BIN="$DERIVED_DATA/Build/Products/Release-iphoneos/AeroDJ.app/AeroDJ"
          test -f "$RELEASE_BIN"
          for NEEDLE in P0EventTrace P0TraceRow P0PollSampler P0DetectorState P0TraceView P0ScenePhaseTrace p0trace p0_diag; do
            if LC_ALL=C grep -a -q "$NEEDLE" "$RELEASE_BIN"; then
              echo "::error::P0 diagnostics code ($NEEDLE) found in a Release build without AERODJ_P0_DIAG"
              exit 1
            fi
          done
          # Owner trial access (Pro gate bypass) compiles only with AERODJ_OWNER_AB (Sentinel B1, #244).
          # Positive control: check-release-disables-paid-voice.sh finds it in a flagged build. -Fry
          if LC_ALL=C grep -a -q ownerTrial "$RELEASE_BIN"; then
            echo "::error::ownerTrial (Pro gate bypass) found in a Release build without AERODJ_OWNER_AB"
            exit 1
          fi
          DIAG_DD="$RUNNER_TEMP/DerivedDataP0Diag"
          xcodebuild build \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DIAG_DD" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) AERODJ_P0_DIAG'
          # Positive control: the same checks do find it when the flag is set.
          DIAG_BIN="$DIAG_DD/Build/Products/Release-iphoneos/AeroDJ.app/AeroDJ"
          # P0EventTrace / P0PollSampler live in the AeroDJCore package, so finding them proves
          # the flag reaches the package too. P0EventTraceHost and P0EventTracePanel are the
          # app's on-screen trace (TEMPORARY with #121 / #133, -Fry).
          for NEEDLE in P0EventTraceHost P0EventTrace P0PollSampler P0TraceView P0EventTracePanel; do
            LC_ALL=C grep -a -q "$NEEDLE" "$DIAG_BIN" || { echo "::error::$NEEDLE missing from the AERODJ_P0_DIAG build"; exit 1; }
          done
      - name: Owner A/B gate script fails closed (fake xcodebuild test)
        run: ios/scripts/check-owner-ab-build-settings-test.sh
      - name: Owner A/B (AERODJ_OWNER_AB) is absent from Release build settings unless dispatched with owner_ab
        # Runs testflight.yml's own composition script, then reads the real Release settings
        # (xcodebuild -showBuildSettings). Push/other events and empty/missing/false inputs
        # must not pass the flag; a dispatch with owner_ab=true must (positive control). -Echo
        run: |
          for CASE in "push true" "pull_request true" "schedule true" "workflow_dispatch " \
                      "workflow_dispatch false" "workflow_dispatch TRUE" "workflow_dispatch true"; do
            read -r EV AB <<< "$CASE" || true
            CONDS="$(EVENT_NAME="$EV" OWNER_AB="${AB:-}" P0_DIAG=false ios/scripts/testflight-swift-conditions.sh)"
            EXTRA=(); [ -z "$CONDS" ] || EXTRA+=("SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited)$CONDS")
            EXPECT=absent; [ "$CASE" != "workflow_dispatch true" ] || EXPECT=present
            echo "== event=$EV owner_ab='${AB:-}' expect=$EXPECT"
            ios/scripts/check-owner-ab-build-settings.sh "$EXPECT" "${EXTRA[@]}"
          done
      - name: Device app embeds no AeroDJPhonon and has no private AMX instructions (ITMS-90755)
        run: |
          for CONFIG in Debug Release; do
            APP="$DERIVED_DATA/Build/Products/$CONFIG-iphoneos/AeroDJ.app"
            test -x "$APP/AeroDJ" || { echo "::error::$APP/AeroDJ missing"; exit 1; }
            if find "$APP" -iname '*Phonon*' -print | grep .; then
              echo "::error::$CONFIG device AeroDJ.app contains Phonon content"; exit 1
            fi
          done
          # Positive control: the pinned PhononCore that build 12 shipped. Resolve explicitly, since
          # no built target links xn-ptts now.
          xcodebuild -resolvePackageDependencies -project ios/AeroDJ.xcodeproj -scheme AeroDJ \
            -derivedDataPath "$DERIVED_DATA" >/dev/null
          CONTROL="$(find "$DERIVED_DATA/SourcePackages" -path '*ios-arm64/*' -name 'libptts_ffi.a' -print -quit)"
          test -n "$CONTROL" || { echo "::error::pinned libptts_ffi.a (ios-arm64) not found for the positive control"; exit 1; }
          ios/scripts/check-no-private-amx.sh "$DERIVED_DATA/Build/Products/Release-iphoneos/AeroDJ.app" "$CONTROL"

  release-archive:
    # Release-only compile errors (TestFlight build 49, #536: a non-exhaustive switch that only
    # Xcode 27.2's Release archive rejects) must fail at PR time, not at the TestFlight cut.
    # Same image, Xcode, SDK, XcodeGen pin and `xcodebuild archive` invocation as testflight.yml's
    # "Archive (Release, manual signing)" step, with the same owner A/B compilation-condition
    # rule. No signing material, no secrets, no export and no upload. Always GitHub-hosted. -Echo
    name: Release archive (Xcode 27.2, unsigned)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      XCODEGEN_VERSION: 2.46.0
      # sha256 of XcodeGen 2.46.0 xcodegen.zip (same pin as testflight.yml).
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Select Xcode 27.2
        # Same pin as testflight.yml: fails fast, with no fallback.
        env:
          XCODE_PATH: /Applications/Xcode_27.2.app
          REQUIRED_SDK: "27.2"
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::$XCODE_PATH not found on this runner. Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "$SDK_VERSION" != "$REQUIRED_SDK" ]; then
            echo "::error::iOS SDK is $SDK_VERSION; this job requires $REQUIRED_SDK"
            exit 1
          fi
      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1 && xcrun metal --version; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading component"
            xcodebuild -downloadComponent MetalToolchain
            if ! xcrun metal --version; then
              echo "::error::Metal toolchain still unavailable after xcodebuild -downloadComponent MetalToolchain"
              exit 1
            fi
          fi
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Archive (Release, unsigned)
        # testflight.yml's archive command with signing switched off. The conditions script runs
        # as for an explicit device-speech upload (no p0_diag, owner_ab or tester_voice):
        # confirm_device_voice=true and tester_voice left false. A dispatch that sets neither
        # is refused before archive, so this is the plain Release those opt-in uploads compile,
        # not an unattended default upload.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/release-archive-logs"
          EXTRA=()
          CONDS="$(EVENT_NAME=workflow_dispatch OWNER_AB=false P0_DIAG=false TESTER_VOICE=false ios/scripts/testflight-swift-conditions.sh)"
          if [ -n "$CONDS" ]; then EXTRA+=("SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited)$CONDS"); fi
          ios/scripts/check-owner-ab-build-settings.sh absent "${EXTRA[@]}"
          xcodebuild archive \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJ \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AeroDJ.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            "${EXTRA[@]}" \
            2>&1 | tee "$RUNNER_TEMP/release-archive-logs/archive.log"
          APP_BUNDLE="$(find "$RUNNER_TEMP/AeroDJ.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)"
          [ -n "$APP_BUNDLE" ] || { echo "::error::no app in the archive"; exit 1; }
          test -f "$APP_BUNDLE/AeroDJ" || { echo "::error::$APP_BUNDLE/AeroDJ missing"; exit 1; }
      - name: Upload archive log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archive-log
          path: ${{ runner.temp }}/release-archive-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  runtime-mode:
    name: Runtime mode on simulator (Debug vs Release)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ (vars.AERODJ_SELF_HOSTED == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","aerodj"]') || 'macos-latest' }}
    timeout-minutes: ${{ (vars.AERODJ_SELF_HOSTED == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 40 || 360 }}
    env:
      XCODEGEN_VERSION: 2.46.0
      DERIVED_DATA: ios/build/DerivedData-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted Mac persists between jobs: do not leave the job token in .git/config (#517 N1, -Sentinel).
          persist-credentials: false
      - name: Check Xcode 26.6 and Swift 6.3
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "xcode-select -p:"
          sel="$(xcode-select -p)"
          printf '%s\n' "$sel"
          if [ ! -d "$sel" ]; then
            echo "::error::Selected Xcode path does not exist: $sel"
            exit 1
          fi
          echo "xcodebuild -version:"
          xcode_out="$(xcodebuild -version)"
          printf '%s\n' "$xcode_out"
          echo "swift --version:"
          swift_out="$(swift --version)"
          printf '%s\n' "$swift_out"
          xcode_ver="$(printf '%s\n' "$xcode_out" | awk 'NR==1 { print $2 }')"
          swift_ver="$(printf '%s\n' "$swift_out" | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p')"
          swift_ver="${swift_ver%%$'\n'*}"
          case "$xcode_ver" in
            26.6|26.6.*) ;;
            *)
              echo "::error::Xcode is ${xcode_ver:-unknown} at $sel; this job requires Xcode 26.6"
              exit 1
              ;;
          esac
          case "$swift_ver" in
            6.3|6.3.*) ;;
            *)
              echo "::error::Swift is ${swift_ver:-unknown}; this job requires Swift 6.3"
              exit 1
              ;;
          esac
      - name: Self-hosted prep (volume and disk checks, DerivedData on the internal disk)
        # See the script: simulator services stall or are denied on the removable work volume. -Orion
        if: runner.environment == 'self-hosted'
        timeout-minutes: 3
        run: ios/scripts/ci-selfhosted-prep.sh runtime-mode
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1 && xcrun metal --version; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading component"
            xcodebuild -downloadComponent MetalToolchain
            if ! xcrun metal --version; then
              echo "::error::Metal toolchain still unavailable after xcodebuild -downloadComponent MetalToolchain"
              exit 1
            fi
          fi
      - name: Build Debug and Release for the simulator
        run: |
          for CONFIG in Debug Release; do
            xcodebuild build \
              -project ios/AeroDJ.xcodeproj \
              -scheme AeroDJ \
              -configuration "$CONFIG" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO
          done
      - name: Boot an iPhone simulator
        timeout-minutes: ${{ runner.environment == 'self-hosted' && 5 || 360 }}
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid // empty')
          test -n "$UDID" || { echo "No available iPhone simulator"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Verify the launch argument changes runtime dependencies
        timeout-minutes: ${{ runner.environment == 'self-hosted' && 25 || 360 }}
        run: |
          ios/scripts/verify-runtime-mode.sh \
            "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AeroDJ.app" \
            "$DERIVED_DATA/Build/Products/Release-iphonesimulator/AeroDJ.app" \
            "$SIM_UDID"
      - name: Release app excludes fixture art, the preview loader and PlaybackFixtures
        run: |
          ios/scripts/check-release-excludes-preview-fixtures.sh \
            "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AeroDJ.app" \
            "$DERIVED_DATA/Build/Products/Release-iphonesimulator/AeroDJ.app"
      - name: App does not embed AeroDJPhonon (ITMS-90755 hold)
        run: |
          for cfg in Debug Release; do
            app="$DERIVED_DATA/Build/Products/$cfg-iphonesimulator/AeroDJ.app"
            test -x "$app/AeroDJ" || { echo "::error::$app/AeroDJ missing"; exit 1; }
            if find "$app" -iname '*Phonon*' -print | grep .; then
              echo "::error::$cfg AeroDJ.app contains Phonon content"; exit 1
            fi
            echo "OK: $cfg AeroDJ.app has no Phonon content."
          done
      - name: Self-hosted cleanup (stop tests and simulators)
        if: always() && runner.environment == 'self-hosted'
        timeout-minutes: 3
        run: ios/scripts/ci-selfhosted-cleanup.sh

  consent-copy-flagged:
    # #631 (-Fry): #629's required `duo-wide-localarea` shot is the unflagged build, so it shows
    # only the App Store consent copy. These two legs are real flagged Debug builds, so the owner
    # gets the tester and owner A/B copy as real captures, not the mock. Compile flags only: no
    # secrets, no paid voices, no network voice calls. Hosted runners only.
    name: Consent copy shots (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.consent == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: tester
            conds: AERODJ_TESTER_VOICE
          - leg: ownerab
            conds: AERODJ_OWNER_AB
    env:
      XCODEGEN_VERSION: 2.46.0
      DERIVED_DATA: ios/build/DerivedData-consent
      SHOTS: ${{ github.workspace }}/consent-copy-shots
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1 && xcrun metal --version; then
            echo "Metal toolchain present"
          else
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version || { echo "::error::Metal toolchain still unavailable"; exit 1; }
          fi
      - name: Pick an iPhone simulator
        run: |
          PHONE=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid // empty')
          test -n "$PHONE" || { echo "Need an iPhone simulator"; exit 1; }
          echo "PHONE_UDID=$PHONE" >> "$GITHUB_ENV"
      - name: Build for testing (${{ matrix.conds }})
        run: |
          xcodebuild build-for-testing \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJStudioUI \
            -destination "id=$PHONE_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            "SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) ${{ matrix.conds }}"
      - name: Local-area prompt at Duo width (${{ matrix.leg }} copy)
        timeout-minutes: 20
        run: |
          mkdir -p "$SHOTS"
          xcrun simctl boot "$PHONE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$PHONE_UDID" -b
          ios/scripts/ui-launch-timeout-retry.sh --udid "$PHONE_UDID" -- \
            env TEST_RUNNER_STUDIO_SCREENSHOT_DIR="$SHOTS" xcodebuild test-without-building \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJStudioUI \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -destination "id=$PHONE_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:AeroDJUITests/AppWideLayoutTests/testDuoWideLocalAreaPromptIsTheReadableColumn \
            CODE_SIGNING_ALLOWED=NO
      - name: Require the ${{ matrix.leg }} consent shot
        run: |
          ls -la "$SHOTS"
          ls "$SHOTS" | grep -q "^duo-wide-localarea-${{ matrix.leg }}_" \
            || { echo "missing duo-wide-localarea-${{ matrix.leg }} screenshot"; exit 1; }
      - name: Upload consent shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consent-copy-shots-${{ matrix.leg }}
          path: consent-copy-shots/*.png
          if-no-files-found: ignore

  studio-screenshots:
    name: Studio UI tests and screenshots (closed + open)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Mini when AERODJ_SELF_HOSTED=1 (all-mini) or AERODJ_MINI_STUDIO=1 (this job only),
    # and only on a same-repo pull_request. Otherwise macos-latest.
    runs-on: ${{ ((vars.AERODJ_SELF_HOSTED == '1' || vars.AERODJ_MINI_STUDIO == '1') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","aerodj"]') || 'macos-latest' }}
    timeout-minutes: ${{ ((vars.AERODJ_SELF_HOSTED == '1' || vars.AERODJ_MINI_STUDIO == '1') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 40 || 150 }}
    env:
      XCODEGEN_VERSION: 2.46.0
      DERIVED_DATA: ios/build/DerivedData-ui
      SHOTS: ${{ github.workspace }}/studio-screenshots
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted Mac persists between jobs: do not leave the job token in .git/config (#517 N1, -Sentinel).
          persist-credentials: false
      - name: Check Xcode 26.6 and Swift 6.3
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "xcode-select -p:"
          sel="$(xcode-select -p)"
          printf '%s\n' "$sel"
          if [ ! -d "$sel" ]; then
            echo "::error::Selected Xcode path does not exist: $sel"
            exit 1
          fi
          echo "xcodebuild -version:"
          xcode_out="$(xcodebuild -version)"
          printf '%s\n' "$xcode_out"
          echo "swift --version:"
          swift_out="$(swift --version)"
          printf '%s\n' "$swift_out"
          xcode_ver="$(printf '%s\n' "$xcode_out" | awk 'NR==1 { print $2 }')"
          swift_ver="$(printf '%s\n' "$swift_out" | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p')"
          swift_ver="${swift_ver%%$'\n'*}"
          case "$xcode_ver" in
            26.6|26.6.*) ;;
            *)
              echo "::error::Xcode is ${xcode_ver:-unknown} at $sel; this job requires Xcode 26.6"
              exit 1
              ;;
          esac
          case "$swift_ver" in
            6.3|6.3.*) ;;
            *)
              echo "::error::Swift is ${swift_ver:-unknown}; this job requires Swift 6.3"
              exit 1
              ;;
          esac
          # The screenshot dir is a fixed workspace path on this Mac. Remove it
          # before any step can treat a previous run's PNGs as this run's shots.
          case "$SHOTS" in
            "$GITHUB_WORKSPACE"/studio-screenshots) rm -rf "$SHOTS" ;;
            *)
              echo "::error::Refusing to remove unexpected screenshot dir: ${SHOTS:-unset}"
              exit 1
              ;;
          esac
      - name: Self-hosted prep (volume and disk checks, DerivedData on the internal disk)
        # See the script: simulator services stall or are denied on the removable work volume. -Orion
        if: runner.environment == 'self-hosted'
        timeout-minutes: 3
        run: ios/scripts/ci-selfhosted-prep.sh studio-screenshots
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if xcrun -f metal >/dev/null 2>&1 && xcrun metal --version; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading component"
            xcodebuild -downloadComponent MetalToolchain
            if ! xcrun metal --version; then
              echo "::error::Metal toolchain still unavailable after xcodebuild -downloadComponent MetalToolchain"
              exit 1
            fi
          fi
      - name: Toolchain
        run: xcodebuild -version
      - name: Pick iPhone (closed) and iPad (open) simulators
        run: |
          pick() {
            xcrun simctl list devices available -j \
              | jq -r --arg p "$1" '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                        | select(.name | startswith($p))] | last | .udid // empty'
          }
          PHONE=$(pick iPhone); PAD=$(pick iPad)
          test -n "$PHONE" && test -n "$PAD" || { echo "Need an iPhone and an iPad simulator"; exit 1; }
          echo "PHONE_UDID=$PHONE" >> "$GITHUB_ENV"
          echo "PAD_UDID=$PAD" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep -E "$PHONE|$PAD"
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJStudioUI \
            -destination "id=$PHONE_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
      - name: UI launch-timeout retry script test
        run: ios/scripts/ui-launch-timeout-retry-test.sh
      - name: Pre-boot the iPhone simulator (self-hosted)
        if: runner.environment == 'self-hosted'
        timeout-minutes: 5
        run: |
          xcrun simctl boot "$PHONE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$PHONE_UDID" -b
      - name: UI tests on iPhone (closed, compact player)
        # Hosted caps from green runs (integration e3aa2f68, a87bcb30, 31417238): iPhone 19-22 min,
        # walkthrough 2 min, iPad 34-43 min. Each test also gets a 10 min allowance
        # (slowest green test about 7 min), so a stuck test fails by name. A stall now fails here instead of at 6 h (#577's hang). -Atlas
        timeout-minutes: ${{ runner.environment == 'self-hosted' && 25 || 40 }}
        run: |
          mkdir -p "$SHOTS"
          xcrun simctl boot "$PHONE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$PHONE_UDID" -b
          ios/scripts/ui-launch-timeout-retry.sh --udid "$PHONE_UDID" -- \
            env TEST_RUNNER_STUDIO_SCREENSHOT_DIR="$SHOTS" xcodebuild test-without-building \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJStudioUI \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -destination "id=$PHONE_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/phone.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Record a tapped walkthrough on iPhone (XCUITest + simctl recordVideo)
        # Hosted cap: see the iPhone UI step. -Atlas
        timeout-minutes: ${{ runner.environment == 'self-hosted' && 25 || 10 }}
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          xcrun simctl boot "$PHONE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$PHONE_UDID" -b
          # simctl's recorder is written by CoreSimulator, which may not write to the self-hosted
          # Mac's removable work volume (NSCocoaErrorDomain 513 / -12204, run 41487498356). There it
          # records to the internal disk and the file is copied into $SHOTS. Hosted: unchanged. -Orion
          OUT="$SHOTS/walkthrough-closed.mp4"
          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            mkdir -p "$HOME/ci-rec/studio-screenshots"
            OUT="$HOME/ci-rec/studio-screenshots/walkthrough-closed.mp4"
          fi
          xcrun simctl io "$PHONE_UDID" recordVideo --codec h264 --force "$OUT" &
          REC=$!
          sleep 2
          # The recorder must still be running before the walkthrough starts.
          # A recorder that dies here is the Mac (disk, volume, simctl), not a Studio assertion.
          kill -0 "$REC" 2>/dev/null || {
            echo "::error::RUNNER INFRA: simctl recordVideo exited before writing a walkthrough video (see its error above). This is not a code failure. Ask the owner (via Orion) to free disk on the mini, or re-run on a clean runner; do not change product code."
            exit 1
          }
          ios/scripts/ui-launch-timeout-retry.sh --udid "$PHONE_UDID" -- \
            env TEST_RUNNER_STUDIO_WALKTHROUGH=1 xcodebuild test-without-building \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJStudioUI \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -destination "id=$PHONE_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:AeroDJUITests/StudioScreenTests/testRecordedWalkthrough \
            CODE_SIGNING_ALLOWED=NO || STATUS=$?
          # The recorder may already have exited; that must not fail the step under bash -e.
          # A failed walkthrough is a Studio failure even when the video is also empty.
          # RUNNER INFRA only when that test passed and the capture is missing or empty.
          capture_or_test_failure() {
            if [ "${STATUS:-0}" -ne 0 ]; then
              echo "::error::walkthrough test failed (exit ${STATUS})"
              exit "${STATUS}"
            fi
            echo "::error::RUNNER INFRA: $* This is not a code failure. Ask the owner (via Orion) to free disk on the mini, or re-run on a clean runner; do not change product code."
            exit 1
          }
          kill -INT "$REC" 2>/dev/null || true
          wait "$REC" || true
          if [ "$OUT" != "$SHOTS/walkthrough-closed.mp4" ]; then
            # REC is the simctl client (xcrun execs it). It logs "Wrote video to" and
            # exits while the mp4 is still 0 bytes; CoreSimulator finishes the file
            # afterwards. Run 43678829149 copied that empty file (both attempts).
            # Two checks, 3 seconds apart, inside 30s. Each size is logged so a mini
            # run shows whether the source fills in. Hosted runners record straight
            # into $SHOTS and do not take this branch.
            size=0
            last=-1
            stable=0
            deadline=$((SECONDS + 30))
            while [ "$SECONDS" -lt "$deadline" ]; do
              size=$(stat -f%z "$OUT" 2>/dev/null || echo 0)
              echo "Walkthrough source $OUT size: ${size} bytes"
              if [ "$size" -gt 0 ] && [ "$size" = "$last" ]; then
                stable=1
                break
              fi
              last=$size
              sleep 3
            done
            if [ "$stable" -ne 1 ]; then
              capture_or_test_failure "walkthrough-closed.mp4 is missing or empty (source size: ${size} bytes)."
            fi
            echo "Walkthrough recording stable at ${size} bytes: $OUT"
            ls -la "$OUT"
            cp "$OUT" "$SHOTS/walkthrough-closed.mp4" || capture_or_test_failure "could not copy walkthrough-closed.mp4 into $SHOTS (source size: ${size} bytes)."
          fi
          ls -la "$SHOTS"/*.mp4 || capture_or_test_failure "walkthrough-closed.mp4 is missing or empty (source size: 0 bytes)."
          exit ${STATUS:-0}
      - name: UI tests on iPad (open, two-zone Studio)
        # Hosted cap: see the iPhone UI step. -Atlas
        timeout-minutes: ${{ runner.environment == 'self-hosted' && 25 || 70 }}
        run: |
          # One simulator at a time: the iPhone stays booted after its steps, and a cold iPad
          # booted by xcodebuild mid-run made launches, terminations and accessibility
          # snapshots stall (flaky iPad failures across PRs). Shut the iPhone down and wait
          # for the iPad to finish booting before the suite starts.
          xcrun simctl shutdown "$PHONE_UDID" 2>/dev/null || true
          xcrun simctl boot "$PAD_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$PAD_UDID" -b
          ios/scripts/ui-launch-timeout-retry.sh --udid "$PAD_UDID" -- \
            env TEST_RUNNER_STUDIO_SCREENSHOT_DIR="$SHOTS" xcodebuild test-without-building \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJStudioUI \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -destination "id=$PAD_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/pad.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Require screenshots
        run: |
          ls -la "$SHOTS"
          ls "$SHOTS" | grep -q '^closed-compact_' || { echo "missing closed screenshot"; exit 1; }
          # #537: the decluttered closed player's ⋯ with Queue and Tune (and the star when rated). -Nova
          ls "$SHOTS" | grep -q '^closed-more-menu_' || { echo "missing closed-more-menu screenshot"; exit 1; }
          ls "$SHOTS" | grep -q '^open-rail-queue-sheet_' || { echo "missing open screenshot"; exit 1; }
          # #465 item 10: Library, Stations and Settings at Duo width, required like
          # duo-wide-ready (AppWideLayoutTests). -Nova
          for shot in duo-wide-library duo-wide-stations duo-wide-settings duo-wide-localarea; do
            ls "$SHOTS" | grep -q "^${shot}_" || { echo "missing $shot screenshot"; exit 1; }
          done
          for shot in closed-dark closed-state-empty closed-state-loading closed-state-error closed-state-denied \
                      closed-connections-revoked closed-tune-config-change closed-large-text \
                      open-rail-tune-dark open-large-text open-connections-revoked open-tune-config-change \
                      closed-queue-sheet-dark open-rail-queue-dark \
                      closed-connections-dark open-rail-connections-dark \
                      closed-station-list-dark open-station-list-dark \
                      closed-state-empty-dark closed-state-loading-dark closed-state-error-dark \
                      closed-state-denied-dark closed-state-playbackFailed-dark \
                      open-state-empty-dark open-state-loading-dark open-state-error-dark \
                      open-state-denied-dark open-state-playbackFailed-dark \
                      closed-ax5-dark open-ax5-dark \
                      closed-onair open-onair \
                      iphone-landscape iphone-landscape-dark ipad-landscape ipad-landscape-dark \
                      duo-wide-ready duo-wide-speaking duo-wide-onair split-narrow split-half split-half-stations split-wide \
                      duo-continuity-folded duo-continuity-unfolded; do
            ls "$SHOTS" | grep -q "^${shot}_" || { echo "missing $shot screenshot"; exit 1; }
          done
          # #454: a station tap (and the Duo dial tap) lands on that station starting, never search (StudioScreenTests). -Nova
          for shot in iphone-station-tap ipad-station-tap ipad-station-tap-dial; do
            ls "$SHOTS" | grep -q "^${shot}_" || { echo "missing $shot screenshot"; exit 1; }
          done
          # #542: the regular-width Duo draws the rail, not the two-pane arrangement (ArrangementPaneTests). -Atlas
          ls "$SHOTS" | grep -q '^duo-regular-rail_' || { echo "missing duo-regular-rail screenshot"; exit 1; }
          # #465 item 3: the tent pose, required like duo-wide-ready (TentPoseTests). -Nova
          ls "$SHOTS" | grep -q '^duo-tent_' || { echo "missing duo-tent screenshot"; exit 1; }
          # Mockup D: the full trailing rail with the vertical song-position bar, one shot per
          # frame of the mock (RailDLayoutTests), required as in #551's pattern. -Nova
          for shot in rail-d-iphone rail-d-duo-closed rail-d-duo-open-portrait rail-d-duo-open-portrait-sidebar \
                      rail-d-duo-open-landscape-spread rail-d-duo-open-landscape-centred \
                      rail-d-duo-open-landscape-sidebar; do
            ls "$SHOTS" | grep -q "^${shot}_" || { echo "missing $shot screenshot"; exit 1; }
          done
          # Open-Duo Stations (owner, 2026-11-17): the three designs in the book pose and upright,
          # and Settings > Stations layout on the iPhone and the Duo (StationsLayoutTests). -Nova
          for shot in stations-layout-a-duo-open-book stations-layout-a-duo-open-portrait \
                      stations-layout-b-duo-open-book stations-layout-b-duo-open-portrait \
                      stations-layout-c-duo-open-book stations-layout-c-duo-open-portrait \
                      settings-stations-layout-iphone settings-stations-layout-duo; do
            ls "$SHOTS" | grep -q "^${shot}_" || { echo "missing $shot screenshot"; exit 1; }
          done
          if [ ! -s "$SHOTS/walkthrough-closed.mp4" ]; then
            size=$(stat -f%z "$SHOTS/walkthrough-closed.mp4" 2>/dev/null || echo 0)
            echo "::error::RUNNER INFRA: walkthrough-closed.mp4 is missing or empty (source size: ${size} bytes). This is not a code failure. Ask the owner (via Orion) to free disk on the mini, or re-run on a clean runner; do not change product code."
            exit 1
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-screenshots
          path: |
            studio-screenshots/*.png
            studio-screenshots/*.mp4
          if-no-files-found: warn
      - name: Collect filtered simulator logs (failure or cancel)
        # The repo is public, so artifacts are downloadable: no full `log collect` archive.
        # Only SpringBoard, testmanagerd and our own subsystem, last 2 h, as text. No secrets
        # are in this job's env. Each `log show` is capped at 120 s and never fails the job,
        # so a wedged simulator can't hang cleanup (#577's SpringBoard idle stall). -Atlas
        if: (failure() || cancelled()) && runner.environment != 'self-hosted'
        timeout-minutes: 6
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/sim-logs"
          for pair in "phone:$PHONE_UDID" "pad:$PAD_UDID"; do
            name="${pair%%:*}"; udid="${pair#*:}"
            [ -n "$udid" ] || continue
            perl -e 'alarm shift; exec @ARGV' 120 \
              xcrun simctl spawn "$udid" log show --last 2h --style compact \
              --predicate 'process == "SpringBoard" OR process == "testmanagerd" OR subsystem == "com.aerodj.app"' \
              > "$RUNNER_TEMP/sim-logs/$name.log" 2>&1 || echo "log show for $name exited $?" >> "$RUNNER_TEMP/sim-logs/$name.log"
          done
          ls -la "$RUNNER_TEMP/sim-logs" || true
      - name: Upload filtered simulator logs
        if: (failure() || cancelled()) && runner.environment != 'self-hosted'
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs-filtered
          path: ${{ runner.temp }}/sim-logs
          retention-days: 5
          if-no-files-found: ignore
      - name: Upload iPhone UI result
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: phone-xcresult
          path: ${{ runner.temp }}/phone.xcresult
          retention-days: 5
          if-no-files-found: warn
      - name: Upload iPad UI result
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pad-xcresult
          path: ${{ runner.temp }}/pad.xcresult
          retention-days: 5
          if-no-files-found: warn
      - name: Self-hosted cleanup (stop tests and simulators)
        if: always() && runner.environment == 'self-hosted'
        timeout-minutes: 3
        run: ios/scripts/ci-selfhosted-cleanup.sh
