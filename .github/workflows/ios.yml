name: iOS

# No top-level path filter: these checks must always report so they can be
# required. The `changes` job skips the macOS jobs when nothing iOS changed,
# and a skipped job reports success.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files via the API

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/ios.yml'

  core-tests:
    name: AeroDJCore tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests
        run: swift test
        working-directory: ios/AeroDJCore

  simulator-build:
    name: iOS simulator build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      XCODEGEN_VERSION: 2.46.0
      DERIVED_DATA: ios/build/DerivedData
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build app and embedded share extension
        run: |
          xcodebuild build \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJ \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify share extension is embedded
        run: |
          APPEX="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AeroDJ.app/PlugIns/AeroDJShare.appex"
          test -d "$APPEX" || { echo "AeroDJShare.appex not embedded in AeroDJ.app"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist" \
            | grep -qx 'com.apple.share-services'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist" | grep -qx 'com.aerodj.app.share'
      - name: Pick an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid // empty')
          test -n "$UDID" || { echo "No available iPhone simulator"; exit 1; }
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Run unit tests on simulator
        run: |
          xcodebuild test \
            -project ios/AeroDJ.xcodeproj \
            -scheme AeroDJ \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: aeroDJ-sim
          path: ${{ env.DERIVED_DATA }}/Build/Products/Debug-iphonesimulator/AeroDJ.app
          if-no-files-found: error

  screenshots:
    name: Duo layout screenshots
    needs: simulator-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Download built app
        uses: actions/download-artifact@v4
        with:
          name: aeroDJ-sim
          path: build/AeroDJ.app
      - name: Boot an iPhone simulator
        run: |
          IPHONE=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid // empty')
          test -n "$IPHONE" || { echo "No iPhone simulator"; exit 1; }
          xcrun simctl boot "$IPHONE" || true
          echo "IPHONE=$IPHONE" >> "$GITHUB_ENV"
      - name: Capture closed (compact with playing state)
        run: |
          xcrun simctl install "$IPHONE" build/AeroDJ.app
          SIMCTL_CHILD_AERODJ_LAUNCH=player SIMCTL_CHILD_AERODJ_DEMO=playing \
            xcrun simctl launch --terminate-running-process "$IPHONE" com.aerodj.app
          sleep 4
          xcrun simctl io "$IPHONE" screenshot /tmp/aerodj-closed-compact.png
      - name: Capture closed (empty state)
        run: |
          xcrun simctl terminate "$IPHONE" com.aerodj.app || true
          SIMCTL_CHILD_AERODJ_LAUNCH=player \
            xcrun simctl launch --terminate-running-process "$IPHONE" com.aerodj.app
          sleep 3
          xcrun simctl io "$IPHONE" screenshot /tmp/aerodj-closed-empty.png
      - name: Capture open (unfolded Studio, wide iPhone)
        run: |
          # Duo open = a wide iPhone canvas; rotate the same iPhone to landscape
          # so the two-zone studio layout engages.
          xcrun simctl terminate "$IPHONE" com.aerodj.app || true
          xcrun simctl io "$IPHONE" rotate left || xcrun simctl io "$IPHONE" rotate right || true
          sleep 2
          SIMCTL_CHILD_AERODJ_LAUNCH=player SIMCTL_CHILD_AERODJ_DEMO=playing \
            xcrun simctl launch --terminate-running-process "$IPHONE" com.aerodj.app
          sleep 4
          xcrun simctl io "$IPHONE" screenshot /tmp/aerodj-open-studio.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aeroDJ-layout-screenshots
          path: /tmp/*.png
          if-no-files-found: error